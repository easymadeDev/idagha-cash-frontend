<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="72%" cy="45%" r="55%">
      <stop offset="0" stop-color="#12854a" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#0b3a22" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#050a07"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="1" stop-color="#e9dfc2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2fd27a" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="#050a07"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <rect width="1600" height="640" fill="url(#grid)"/>

  <!-- giant outline word -->
  <text x="1560" y="600" text-anchor="end" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="260"
        fill="none" stroke="#f0c445" stroke-opacity="0.13" stroke-width="3" letter-spacing="-8">REUNION</text>

  <!-- calendar page -->
  <g transform="translate(1010 120) rotate(-5)">
    <rect width="300" height="320" rx="22" fill="url(#paper)"/>
    <rect width="300" height="84" rx="22" fill="#12854a"/>
    <rect y="60" width="300" height="24" fill="#12854a"/>
    <circle cx="80" cy="0" r="12" fill="#f0c445"/>
    <circle cx="220" cy="0" r="12" fill="#f0c445"/>
    <text x="150" y="58" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#fbf6e8" letter-spacing="4">SAVE THE DATE</text>
    <!-- date grid, one day circled -->
    <g fill="#0f3d22" opacity="0.22">
      <rect x="36" y="118" width="36" height="30" rx="6"/><rect x="88" y="118" width="36" height="30" rx="6"/><rect x="140" y="118" width="36" height="30" rx="6"/><rect x="192" y="118" width="36" height="30" rx="6"/><rect x="244" y="118" width="20" height="30" rx="6"/>
      <rect x="36" y="166" width="36" height="30" rx="6"/><rect x="88" y="166" width="36" height="30" rx="6"/><rect x="192" y="166" width="36" height="30" rx="6"/><rect x="244" y="166" width="20" height="30" rx="6"/>
      <rect x="36" y="214" width="36" height="30" rx="6"/><rect x="88" y="214" width="36" height="30" rx="6"/><rect x="140" y="214" width="36" height="30" rx="6"/><rect x="192" y="214" width="36" height="30" rx="6"/><rect x="244" y="214" width="20" height="30" rx="6"/>
      <rect x="36" y="262" width="36" height="30" rx="6"/><rect x="88" y="262" width="36" height="30" rx="6"/><rect x="140" y="262" width="36" height="30" rx="6"/>
    </g>
    <circle cx="158" cy="181" r="30" fill="none" stroke="#e0a91a" stroke-width="7"/>
    <path d="M146 182l9 9 18-20" stroke="#12854a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RSVP ticket -->
  <g transform="translate(900 360) rotate(8)">
    <path d="M0 0h200v34a18 18 0 0 0 0 36v34H0V70a18 18 0 0 0 0-36z" fill="#f0c445"/>
    <path d="M60 8v88" stroke="#b8890f" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="130" y="66" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#0f3d22">RSVP</text>
  </g>

  <!-- confetti -->
  <g>
    <rect x="930" y="110" width="14" height="26" rx="3" fill="#f0c445" transform="rotate(25 937 123)"/>
    <rect x="1380" y="80" width="12" height="24" rx="3" fill="#2fd27a" transform="rotate(-30 1386 92)"/>
    <rect x="1420" y="430" width="14" height="26" rx="3" fill="#f0c445" transform="rotate(40 1427 443)"/>
    <rect x="860" y="270" width="10" height="20" rx="3" fill="#2fd27a" transform="rotate(-15 865 280)"/>
    <circle cx="1350" cy="520" r="7" fill="#f0c445" opacity="0.8"/>
    <circle cx="980" cy="520" r="5" fill="#2fd27a" opacity="0.8"/>
    <circle cx="1450" cy="250" r="6" fill="#fbf6e8" opacity="0.6"/>
  </g>
</svg>
